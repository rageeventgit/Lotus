pluginVersion=1.1.0
pluginSinceBuild=243
# Oldest IDE `verifyPlugin` checks against; keep in step with pluginSinceBuild.
verifyOldestVersion=2024.3.7

# IDE to build and test against. IC (Community) is used because Ultimate's obfuscated
# classes can't host platform tests; the plugin itself runs in both.
platformType=IC
platformVersion=2026.2.3

# Optional: compile against an already-installed IDE instead of downloading one (tests
# won't run against an Ultimate install), e.g.
# platformLocalPath=C:/Users/you/AppData/Local/Programs/IntelliJ IDEA
platformLocalPath=

org.gradle.jvmargs=-Xmx2g
org.gradle.configuration-cache=true
kotlin.stdlib.default.dependency=false
