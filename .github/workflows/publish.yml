name: Publish

# Runs when a GitHub release is published: deploys the Maven artifacts to GitHub Packages and
# attaches the IntelliJ plugin zip to the release.
on:
  release:
    types: [published]
  workflow_dispatch:

permissions:
  contents: write
  packages: write

jobs:
  maven:
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v5
      # Writes a settings.xml with a <server id="github"> that authenticates with GITHUB_TOKEN.
      - uses: actions/setup-java@v5
        with:
          distribution: temurin
          java-version: '17'
          cache: maven
          server-id: github
      - run: mvn -B deploy
        env:
          GITHUB_TOKEN: ${{ secrets.GITHUB_TOKEN }}

  intellij-plugin:
    runs-on: ubuntu-latest
    defaults:
      run:
        working-directory: lotus-intellij
    steps:
      - uses: actions/checkout@v5
      - uses: actions/setup-java@v5
        with:
          distribution: temurin
          java-version: '25'
      - uses: gradle/actions/setup-gradle@v5
      - run: ./gradlew buildPlugin
      - if: github.event_name == 'release'
        run: gh release upload "${{ github.event.release.tag_name }}" build/distributions/*.zip --clobber
        env:
          GH_TOKEN: ${{ secrets.GITHUB_TOKEN }}
      - uses: actions/upload-artifact@v5
        with:
          name: lotus-intellij
          path: lotus-intellij/build/distributions/*.zip
